name: Parcel Town Preview APK
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_file_id:
        description: Google Drive file ID of the Parcel Town source ZIP (must be accessible by the runner)
        required: true
        default: "17s4zcIj0t0Si54phRUAqS-oz_mxYUgSj"
      version_name:
        description: Android version name matching the selected source
        required: true
        default: "0.6.2"
      version_code:
        description: Increasing Android versionCode
        required: true
        default: "22"
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          "$SDKMANAGER" --version
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Download project source from Drive
        env:
          FILE_ID: ${{ inputs.source_file_id || '17s4zcIj0t0Si54phRUAqS-oz_mxYUgSj' }}
        run: |
          python3 -m pip install --quiet gdown
          gdown "$FILE_ID" -O /tmp/parcel-source.zip
          unzip -t /tmp/parcel-source.zip
          mkdir -p /tmp/parcel-project
          unzip -q /tmp/parcel-source.zip -d /tmp/parcel-project
          SOURCE_ROOT="$(find /tmp/parcel-project -maxdepth 3 -type f -name package.json -printf '%h\n' | head -1)"
          test -n "$SOURCE_ROOT"
          test -f "$SOURCE_ROOT/capacitor.config.json"
          echo "Using source: $SOURCE_ROOT"
          cp -a "$SOURCE_ROOT"/. .
      - name: Apply verified v0.6.1 upgrade
        run: |
          base64 --decode patches/v0.6.1.patch.gz.b64 | gzip --decompress > /tmp/parcel-v061.patch
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/tmp/parcel-v061.patch')
          s=p.read_text()
          start=s.index('--- a/sw.js\\n'.replace('\\n','\n'))
          end=s.index('--- /dev/null',start)
          p.write_text(s[:start]+s[end:])
          sw=Path('sw.js')
          text=sw.read_text()
          text,n=re.subn(r"const CACHE='[^']+'", "const CACHE='parcel-town-playtest-v0.6.1'",text,count=1)
          assert n==1
          sw.write_text(text)
          PY
          patch --dry-run --batch -p1 < /tmp/parcel-v061.patch
          patch --batch -p1 < /tmp/parcel-v061.patch
          grep -q '"version": "0.6.1"' package.json
          grep -q "parcel-town-playtest-v0.6.1" sw.js
      - name: Verify and repair v0.6.2 Maps and cinematic artwork
        run: |
          node scripts/upgrade-v062.mjs
          node tests/verify_v062.cjs
      - name: Prepare Capacitor Android project
        run: |
          npm install --no-audit --no-fund
          npm run prepare:web
          npx cap add android
          npx cap sync android
          npm run android:icons
          npm run android:immersive
      - name: Run available tests
        run: |
          LATEST=$(find tests -maxdepth 1 -name "verify_v*.cjs" | sort -V | tail -1)
          test -n "$LATEST"
          node "$LATEST"
      - name: Configure permanent signing and version
        env:
          KEYSTORE_B64: ${{ secrets.PARCEL_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PARCEL_KEYSTORE_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name || '0.6.2' }}
          VERSION_CODE: ${{ inputs.version_code || '22' }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD"
          python3 - <<'PYCODE'
          import os,base64,pathlib,re
          path=pathlib.Path('android/app/build.gradle')
          code=os.environ['VERSION_CODE']
          name=os.environ['VERSION_NAME']
          assert code.isdigit() and re.fullmatch(r'[0-9A-Za-z._-]+',name)
          s=path.read_text()
          s,n=re.subn(r'versionCode\s+\d+', 'versionCode '+code,s,count=1); assert n==1
          s,n=re.subn(r'versionName\s+"[^"]+"','versionName "'+name+'"',s,count=1); assert n==1
          path.write_text(s)
          pathlib.Path('android/app/parcel-release.p12').write_bytes(base64.b64decode(os.environ['KEYSTORE_B64'],validate=True))
          PYCODE
          cat >> android/app/build.gradle <<'GRADLE'
          android {
            signingConfigs {
              parcelPermanent {
                storeFile file('parcel-release.p12')
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'parceltown-preview'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
                storeType 'pkcs12'
              }
            }
            buildTypes {
              release { signingConfig signingConfigs.parcelPermanent }
            }
          }
          GRADLE
      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.PARCEL_KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Verify APK
        env:
          VERSION_CODE: ${{ inputs.version_code || '22' }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" | grep "name='com.blythlabs.parceltown.preview'"
          "$AAPT" dump badging "$APK" | grep "versionCode='$VERSION_CODE'"
          "$SIGNER" verify --verbose --print-certs "$APK" | tee signing-verification.txt
          grep -iq '7bd60d0b87866b385c2f595c134eba5993825da73f251a09d5840c13e31fec4f' signing-verification.txt
          cp "$APK" ParcelTown-Preview.apk
          sha256sum ParcelTown-Preview.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ParcelTown-Signed-Preview-APK
          path: |
            ParcelTown-Preview.apk
            SHA256SUMS.txt
            signing-verification.txt
          retention-days: 30
