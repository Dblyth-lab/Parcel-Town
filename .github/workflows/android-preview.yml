name: Parcel Town Preview APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/android-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download approved v1.4.5 source
        run: |
          python3 -m pip install --quiet gdown
          gdown '1k1cyhc2WE2AK14sEqethQn0NJFv9h1jC' -O /tmp/parcel-v145.zip
          unzip -tqq /tmp/parcel-v145.zip
          unzip -oq /tmp/parcel-v145.zip -d .
          test "$(node -p 'require("./package.json").version')" = '1.4.5'
          test "$(node -p 'require("./capacitor.config.json").appId')" = 'com.blythlabs.parceltown.preview'
      - name: Test source and prepare Android
        run: |
          npm install --no-audit --no-fund
          node tests/verify_v145.cjs
          node tests/verify_delivery_bonus.cjs
          node tests/verify_reward_delivery.cjs
          npm run prepare:web
          npx cap add android
          npx cap sync android
          npm run android:icons
          npm run android:immersive
      - name: Set version and permanent signing
        env:
          KEYSTORE_B64: ${{ secrets.PARCEL_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PARCEL_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD"
          python3 - <<'PY'
          import os,base64,pathlib,re
          p=pathlib.Path('android/app/build.gradle')
          s=p.read_text()
          s,n=re.subn(r'versionCode\s+\d+','versionCode 31',s,count=1);assert n==1
          s,n=re.subn(r'versionName\s+"[^"]+"','versionName "1.4.5"',s,count=1);assert n==1
          p.write_text(s)
          pathlib.Path('android/app/parcel-release.p12').write_bytes(base64.b64decode(os.environ['KEYSTORE_B64'],validate=True))
          PY
          cat >> android/app/build.gradle <<'GRADLE'
          android {
            signingConfigs {
              parcelPermanent {
                storeFile file('parcel-release.p12')
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias 'parceltown-preview'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
                storeType 'pkcs12'
              }
            }
            buildTypes { release { signingConfig signingConfigs.parcelPermanent } }
          }
          GRADLE
      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.PARCEL_KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Verify original certificate and package
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" | grep "name='com.blythlabs.parceltown.preview'"
          "$AAPT" dump badging "$APK" | grep "versionCode='31'"
          "$SIGNER" verify --verbose --print-certs "$APK" | tee signing-verification.txt
          grep -iq '7bd60d0b87866b385c2f595c134eba5993825da73f251a09d5840c13e31fec4f' signing-verification.txt
          cp "$APK" ParcelTown-v1.4.5-Preview.apk
          sha256sum ParcelTown-v1.4.5-Preview.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ParcelTown-v1.4.5-Signed-APK
          path: |
            ParcelTown-v1.4.5-Preview.apk
            SHA256SUMS.txt
            signing-verification.txt
          retention-days: 30
